<rect x="40" y="542" width="520" height="60" rx="12" fill="#E6F9FB" stroke="#129FAD" stroke-width="2"/>
<text x="56" y="566" font-size="15" font-weight="700" fill="#1E3A5F">6. thanks</text>
<text x="544" y="566" font-size="12" text-anchor="end" fill="#34495E">say · chrome</text>
<text x="56" y="586" font-size="12" fill="#34495E">say &quot;thanks&quot;</text>
<line x1="300" y1="602" x2="300" y2="624" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="626" width="140" height="36" rx="18" fill="#1E3A5F"/>
<text x="300" y="649" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">complete (final)</text>
<line x1="596" y1="126" x2="596" y2="572" stroke="#34495E" stroke-width="2" stroke-dasharray="4 4"/>
<line x1="560" y1="126" x2="596" y2="126" stroke="#34495E" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="210" x2="596" y2="210" stroke="#34495E" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="294" x2="596" y2="294" stroke="#34495E" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="378" x2="596" y2="378" stroke="#34495E" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="475" x2="596" y2="475" stroke="#34495E" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="572" x2="596" y2="572" stroke="#34495E" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="608" y="301" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#34495E" stroke-width="2"/>
<text x="698" y="327" font-size="13" font-weight="700" text-anchor="middle" fill="#1E3A5F">paused</text>
<text x="698" y="347" font-size="11" text-anchor="middle" fill="#34495E">PAUSE from any step</text>
<text x="698" y="365" font-size="11" text-anchor="middle" fill="#34495E">RESUME → same step</text>
<text x="698" y="383" font-size="11" text-anchor="middle" fill="#34495E">ABORT → complete</text>
</svg>
