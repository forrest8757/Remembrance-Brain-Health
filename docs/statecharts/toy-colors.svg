<svg xmlns="http://www.w3.org/2000/svg" width="820" height="686" viewBox="0 0 820 686" font-family="Inter, system-ui, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E3A5F"/></marker></defs>
<rect width="100%" height="100%" fill="#F5F1EA"/>
<text x="40" y="40" font-size="20" font-weight="700" fill="#1E3A5F">Say three colors (pipeline toy)</text>
<text x="40" y="64" font-size="12" fill="#34495E">toy-colors · spec 0.1.0 · generated from the compiled XState machine</text>
<rect x="570" y="28" width="14" height="14" rx="3" fill="#E8EEF6" stroke="#1E3A5F"/><text x="590" y="40" font-size="12" fill="#34495E">protocol zone</text>
<rect x="690" y="28" width="14" height="14" rx="3" fill="#E6F9FB" stroke="#129FAD"/><text x="710" y="40" font-size="12" fill="#34495E">chrome zone</text>
<rect x="40" y="96" width="520" height="60" rx="12" fill="#E6F9FB" stroke="#129FAD" stroke-width="2"/>
<text x="56" y="120" font-size="15" font-weight="700" fill="#1E3A5F">1. intro</text>
<text x="544" y="120" font-size="12" text-anchor="end" fill="#34495E">say · chrome</text>
<text x="56" y="140" font-size="12" fill="#34495E">say &quot;intro&quot;</text>
