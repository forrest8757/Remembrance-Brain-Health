<text x="56" y="288" font-size="15" font-weight="700" fill="#1E3A5F">3. stimuli</text>
<text x="544" y="288" font-size="12" text-anchor="end" fill="#34495E">present · protocol</text>
<text x="56" y="308" font-size="12" fill="#34495E">present colors @ 1000 ms</text>
<line x1="300" y1="324" x2="300" y2="346" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="348" width="520" height="60" rx="12" fill="#E8EEF6" stroke="#1E3A5F" stroke-width="2"/>
<text x="56" y="372" font-size="15" font-weight="700" fill="#1E3A5F">4. yourTurn</text>
<text x="544" y="372" font-size="12" text-anchor="end" fill="#34495E">say · protocol</text>
<text x="56" y="392" font-size="12" fill="#34495E">say &quot;yourTurn&quot;</text>
<line x1="300" y1="408" x2="300" y2="430" stroke="#1E3A5F" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="432" width="520" height="86" rx="12" fill="#E8EEF6" stroke="#1E3A5F" stroke-width="2"/>
<text x="56" y="456" font-size="15" font-weight="700" fill="#1E3A5F">5. recall</text>
<text x="544" y="456" font-size="12" text-anchor="end" fill="#34495E">respond · protocol</text>
<text x="56" y="476" font-size="12" fill="#34495E">respond ≤ 20 s</text>
<rect x="56" y="486" width="82.8" height="20" rx="10" fill="#FFFFFF" stroke="#1E3A5F"/>
<text x="97.4" y="500" font-size="11" text-anchor="middle" fill="#1E3A5F">listening</text>
<rect x="144.8" y="486" width="82.8" height="20" rx="10" fill="#FFFFFF" stroke="#1E3A5F"/>
<text x="186.20000000000002" y="500" font-size="11" text-anchor="middle" fill="#1E3A5F">capturing</text>
<rect x="233.60000000000002" y="486" width="68.4" height="20" rx="10" fill="#FFFFFF" stroke="#1E3A5F"/>
<text x="267.8" y="500" font-size="11" text-anchor="middle" fill="#1E3A5F">judging</text>
