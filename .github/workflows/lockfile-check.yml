name: Lockfile check

# Catches the same failure Vercel's build hits in production: pnpm-lock.yaml
# out of sync with pnpm-workspace.yaml / package.json (e.g. an edited
# `overrides` block that nobody regenerated the lockfile for). Runs the
# exact frozen install Vercel runs, so it fails fast in CI/PRs instead of
# in a deploy log.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frozen-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Verify pnpm-lock.yaml matches pnpm-workspace.yaml / package.json
        run: pnpm install --frozen-lockfile
