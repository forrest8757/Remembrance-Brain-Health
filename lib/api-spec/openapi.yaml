openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /waitlist:
    post:
      operationId: joinWaitlist
      summary: Join the Remembrance early-access waitlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistInput"
      responses:
        "200":
          description: Signup saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaitlistResult"
        "400":
          description: Invalid email
        "429":
          description: Please wait before retrying
        "503":
          description: Temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    WaitlistInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    WaitlistResult:
      type: object
      required: [message]
      properties:
        message:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

